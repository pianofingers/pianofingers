<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Piano Fingers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#050505;
    --white:#f4f4f1;
    --coral:#ff6f52;
    --line:rgba(244,244,241,0.16);
    --line-strong:rgba(244,244,241,0.30);
    --dim:rgba(244,244,241,0.5);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--black);
    color:var(--white);
    font-family:'Inter', sans-serif;
    overflow-y:auto;
    overflow-x:hidden;
  }

  .page{
    min-height:100vh;
    height:100vh;
    display:flex;
    flex-direction:column;
    padding: clamp(15px,1.8vh,26px) clamp(16px,2.4vw,36px) clamp(8px,1.2vh,14px);
    gap: clamp(8px,1.4vh,16px);
    max-width:1400px;
    margin:0 auto;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:grid;
    grid-template-columns:auto 1fr auto;
    grid-template-areas:"brand gf support";
    align-items:center;
    gap:16px;
  }
  .brand{ grid-area:brand; }
  .global-functions{ grid-area:gf; }
  .support-btn{ grid-area:support; justify-self:end; }

  /* ---------- Global Functions ---------- */
  .global-functions{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .gf-title{
    font-size:10px;
    letter-spacing:0.12em;
    color:var(--dim);
    text-transform:uppercase;
  }
  .gf-row{
    display:flex;
    align-items:center;
    gap:28px;
  }
  .mode-toggle{
    display:flex;
    border:2px solid var(--white);
    border-radius:999px;
    overflow:hidden;
  }
  .mode-btn{
    background:transparent;
    border:none;
    color:var(--white);
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.02em;
    padding:9px 18px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .mode-btn.active{
    background:var(--coral);
    color:#050505;
  }

  @media (max-width:899px){
    .topbar{
      grid-template-columns:1fr auto;
      grid-template-areas:
        "brand support"
        "gf gf";
      row-gap:10px;
    }
    .support-btn{ justify-self:end; }
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .logo-image{
    height:clamp(46px,7.3vh,70px);
    width:auto;
    display:block;
  }
  .support-btn{
    padding:7px 18px;
    border:2px solid var(--coral);
    border-radius:999px;
    color:var(--white);
    background:transparent;
    font-family:'Inter', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.03em;
    text-decoration:none;
    cursor:pointer;
    white-space:nowrap;
    transition:background 0.15s ease, color 0.15s ease;
  }
  .support-btn .heart{ margin-left:6px; }
  .support-btn:hover{ background:var(--coral); color:#050505; }

  .topbar-divider{
    height:1px;
    background:var(--line-strong);
    width:100vw;
    margin-left:calc(50% - 50vw);
    margin-top:clamp(8px,1.4vh,16px);
    margin-bottom:20px;
  }

  /* ---------- Controls row ---------- */
  .controls-zone{
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    width:100%;
  }
  .controls-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:clamp(10px,1.6vw,22px);
    width:100%;
  }
  .control{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
  }
  .control-label{
    font-size:clamp(10px,1.3vh,12px);
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--white);
    white-space:nowrap;
  }
  .control-label .accent{ color:var(--coral); }
  .control-label .num{ color:var(--dim); font-weight:400; }

  .stepper{
    display:flex;
    align-items:center;
    justify-content:space-between;
    width:100%;
    border:1.5px solid var(--white);
    border-radius:999px;
    padding:6px 6px;
    gap:6px;
  }
  .step-arrow{
    background:transparent;
    border:none;
    color:var(--white);
    font-size:clamp(18px,2.3vh,24px);
    line-height:1;
    padding:6px 10px;
    cursor:pointer;
    border-radius:999px;
    flex-shrink:0;
  }
  .step-arrow:hover{ color:var(--coral); }
  .step-value{
    font-weight:700;
    font-size:clamp(17px,2.6vh,26px);
    text-align:center;
    flex:1 1 auto;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .step-value.accent{ color:var(--coral); }
  .step-value-sm{ font-size:clamp(15px,2.25vh,22px); }
  .accent{ color:var(--coral); }

  /* ---------- Keyboard ---------- */
  .keyboard-section{
    flex:6 1 0;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
    gap:8px;
  }
  .kb-wrap{
    width:100%;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .kb-wrap svg{
    width:100%;
    height:auto;
    max-height:100%;
    display:block;
  }

  /* ---------- Transport row ---------- */

  .transport-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:clamp(41px,6.9vw,97px);
    width:100%;
  }
  .transport-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--white);
    cursor:pointer;
    font-family:inherit;
    padding:2px;
  }
  .transport-icon{
    width:clamp(46px,7.4vh,67px);
    height:clamp(46px,7.4vh,67px);
    border-radius:50%;
    border:2px solid var(--white);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(16px,2.3vh,23px);
    color:var(--white);
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  /* Loop matches Play icon size */
  #loopBtn .transport-icon svg{ width:65%; height:65%; }
  .transport-btn.active .transport-icon{
    background:var(--coral);
    border-color:var(--coral);
    color:#050505;
  }
  .play-btn .transport-icon{
    background:var(--coral);
    border-color:var(--coral);
    color:#050505;
  }
  .play-btn .transport-icon svg{ width:38%; height:38%; }
  .play-btn.active .transport-icon{
    background:transparent;
    color:var(--coral);
  }
  .transport-label{
    font-weight:700;
    font-size:clamp(14px,1.85vh,17px);
  }
  .transport-sub{
    display:none;
  }
  /* Transport panel (full-width box containing play/metronome/loop) */
  .transport-panel{
    flex:0 0 auto;
    margin-bottom:clamp(12px,2vh,20px);
    border:1.5px solid var(--line-strong);
    border-radius:16px;
    padding:clamp(14px,2.2vh,22px) clamp(12px,1.6vw,18px);
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
  }
  .transport-panel .transport-row{
    width:100%;
  }

  /* ---------- Bottom row / panels ---------- */
  .bottom-row{
    display:grid;
    grid-template-columns: 1.15fr 0.75fr 1.45fr;
    gap:clamp(10px,1.6vw,20px);
    flex:0 0 auto;
    align-items:stretch;
  }
  .panel{
    border:1.5px solid var(--line-strong);
    border-radius:16px;
    padding:clamp(10px,1.6vh,16px) clamp(12px,1.6vw,18px);
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .panel-title{
    font-size:clamp(9px,1.15vh,11px);
    letter-spacing:0.1em;
    color:var(--white);
    opacity:0.85;
    text-transform:uppercase;
    margin-bottom:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-align:center;
    width:100%;
  }
  .panel-title-row{
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    margin-bottom:10px;
  }
  .panel-title-row .panel-title{ margin-bottom:0; }
  #notesPanelTitle{
    display:block;
    font-size:clamp(14px,1.8vh,18px);
    margin-top:6px;
    opacity:1;
  }
  .page-indicator{
    font-size:11px;
    color:var(--dim);
    flex-shrink:0;
    position:absolute;
    right:0;
  }

  /* notes panel */
  .notes-panel-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    margin:auto 0;
  }
  .notes-body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    width:100%;
  }
  .note-pills{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:7px;
    row-gap:8px;
    width:100%;
  }
  .note-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    width:clamp(38px,4.8vh,48px);
    height:clamp(38px,4.8vh,48px);
    border-radius:50%;
    border:2px solid var(--white);
    background:transparent;
    color:var(--white);
    font-family:'Inter', sans-serif;
    font-size:clamp(14px,1.8vh,17px);
    font-weight:700;
    cursor:pointer;
    flex-shrink:0;
    padding:0;
  }
  .note-pill:hover{ border-color:var(--coral); }
  .note-pill.active{ background:var(--coral); color:#050505; border-color:transparent; }
  .interval-table{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    margin-top:12px;
  }
  .interval-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .interval-label{
    flex-shrink:0;
    font-size:10px;
    letter-spacing:0.08em;
    color:var(--dim);
    text-transform:uppercase;
  }
  .interval-vals{
    display:flex;
    flex-wrap:nowrap;
    justify-content:center;
    gap:10px;
    font-size:12px;
    font-weight:600;
    color:var(--white);
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
  }
  .interval-vals::-webkit-scrollbar{ display:none; }
  .interval-vals span{ min-width:24px; display:inline-block; text-align:center; }

  /* hands panel */
  .hands-panel .hand-legend{
    display:flex;
    justify-content:space-evenly;
    align-items:center;
    gap:10px;
    margin:auto 0;
    padding-top:14px;
  }
  .hand-block{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
    opacity:1;
    transition:opacity 0.2s ease;
    min-width:0;
  }
  .hand-block.faded{ opacity:0.28; }
  .hand-title{
    font-size:9px;
    letter-spacing:0.1em;
    color:var(--white);
    white-space:nowrap;
  }
  .hand-image-wrap{
    position:relative;
    width:clamp(58px,9vh,96px);
  }
  .hand-image-wrap img{ width:100%; display:block; }
  .finger-num{
    position:absolute;
    transform:translate(-50%, calc(-100% - 6px));
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:clamp(9px,1.3vh,13px);
    color:var(--coral);
    transition:color 0.15s ease;
  }
  .finger-num.dim{
    color:#3a3a3a;
  }

  /* quick scales panel */
  .quick-panel{ padding-left:36px; padding-right:36px; }
  .quick-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:8px;
    flex:1 1 auto;
    align-content:center;
    align-items:center;
    justify-items:center;
    width:100%;
    height:100%;
  }
  .quick-btn{
    border:2px solid var(--white);
    border-radius:999px;
    padding:clamp(5px,1vh,8px) 6px;
    font-family:'Inter', sans-serif;
    font-size:clamp(9px,1.25vh,11px);
    font-weight:500;
    background:transparent;
    color:var(--white);
    cursor:pointer;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    width:85%;
  }
  .quick-btn:hover{ border-color:var(--coral); }
  .quick-btn.active{ background:var(--coral); color:#050505; border-color:transparent; }
  .quick-btn-filler{
    border-color:transparent;
    pointer-events:none;
    visibility:hidden;
  }
  .quick-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--line-strong);
    background:var(--black);
    color:var(--white);
    font-size:14px;
    line-height:1;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .quick-nav:hover{ border-color:var(--coral); color:var(--coral); }
  .quick-nav.prev{ left:8px; }
  .quick-nav.next{ right:8px; }

  /* ---------- Footer ---------- */
  .footer{
    text-align:center;
    font-size:10px;
    color:var(--dim);
    flex:0 0 auto;
  }




  /* ---- Desktop tier (1281px+): extra breathing room below logo ---- */
  @media (min-width:1281px){
  }

  /* ---- iPad tier (900px–1280px): keep the 3-column bottom layout ---- */
  @media (min-width:900px) and (max-width:1280px){
    .page{ height:auto; min-height:100vh; }
    body{ overflow-y:auto; }
  }

  /* ---- Narrow landscape (phones, <900px wide, landscape orientation):
     still usable, just scrollable rather than locked to 100vh ---- */
  @media (max-width:899px) and (orientation:landscape){
    .page{ padding-left:28px; padding-right:28px; }
    .topbar{
      grid-template-columns:auto 1fr auto;
      grid-template-areas:"brand gf support";
      row-gap:0;
    }
    .global-functions{ gap:4px; }
    .controls-row{ grid-template-columns:repeat(3, 1fr); }
    .tempo-control{ display:none; }
    .transport-panel{ display:none; }
    .bottom-row{ display:none; }
    .page{ height:auto; min-height:100vh; }
    body{ overflow-y:auto; }
  }

  /* ---- Narrow portrait: too narrow for the layout — block it
     with a message rather than showing a stripped-down view ---- */
  .rotate-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:var(--black);
    color:var(--white);
    z-index:999;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:32px;
    gap:16px;
  }
  .rotate-overlay .rotate-icon{ font-size:44px; color:var(--coral); }
  .rotate-overlay p{ font-size:15px; max-width:280px; line-height:1.5; margin:0; }

  @media (max-width:899px) and (orientation:portrait){
    .page{ display:none; }
    .rotate-overlay{ display:flex; }
  }
</style>
</head>

function computeThumbLandings(isWhite, n){
  const landings = [];
  let i = 0;
  while(i < n && !isWhite[i]) i++;
  if(i >= n) return landings;
  if(i <= 3){
    landings.push(i);
  } else {
    const compromise = Math.max(0, i - 2);
    landings.push(compromise);
    landings.push(i);
  }
  let last = landings[landings.length - 1];
  for(let j = last + 1; j < n; j++){
    const blackBoundary = isWhite[j] && !isWhite[j-1] && j !== n - 1;
    const forced = (j - last) >= 4;
    if((blackBoundary || forced) && (j - last) >= 2){
      landings.push(j);
      last = j;
    }
  }
  return landings;
}

function heuristicRH(offsets, root){
  const isWhite = offsets.map(o => WHITE_PC.has((root + o) % 12));
  const n = offsets.length;
  const f = new Array(n).fill(0);
  const landings = computeThumbLandings(isWhite, n);
  if(landings.length === 0){
    for(let k = 0; k < n; k++) f[k] = (k % 4) + 1;
    return f;
  }
  for(let k = 0; k < landings[0]; k++) f[k] = Math.min(2 + k, 5);
  for(let g = 0; g < landings.length; g++){
    const start = landings[g];
    const end = (g + 1 < landings.length) ? landings[g + 1] : n;
    f[start] = 1;
    let fin = 2;
    for(let j = start + 1; j < end; j++){ f[j] = Math.min(fin, 5); fin++; }
  }
  return f;
}

function computeLHLandings(isWhite, n){
  let i = 0;
  while(i < n && !isWhite[i]) i++;
  if(i >= n) return [];
  if(i === 0){
    let j = 1;
    while(j < n){
      if(isWhite[j] && !isWhite[j-1] && j !== n - 1){ i = j; break; }
      if(j >= 4){ i = j; break; }
      j++;
    }
    if(j >= n) i = Math.min(4, n - 1);
  }
  const landings = [i];
  let last = i;
  for(let j = i + 1; j < n; j++){
    const blackBoundary = isWhite[j] && !isWhite[j-1] && j !== n - 1;
    const forced = (j - last) >= 4;
    if((blackBoundary || forced) && (j - last) >= 2){ landings.push(j); last = j; }
  }
  return landings;
}

function heuristicLH(offsets, root){
  const isWhite = offsets.map(o => WHITE_PC.has((root + o) % 12));
  const n = offsets.length;
  const f = new Array(n).fill(0);
  const landings = computeLHLandings(isWhite, n);
  if(landings.length === 0){
    for(let k = 0; k < n; k++) f[k] = (k % 4) + 1;
    return f;
  }
  const lead = landings[0];
  for(let k = 0; k < lead; k++) f[k] = Math.min(lead - k + 1, 5);
  for(let g = 0; g < landings.length; g++){
    const start = landings[g];
    const end = (g + 1 < landings.length) ? landings[g + 1] : n;
    f[start] = 1;
    if(end < n){
      for(let j = start + 1; j < end; j++) f[j] = Math.min((end - j) + 1, 5);
    } else {
      let fin = 2;
      for(let j = start + 1; j < end; j++){ f[j] = Math.min(fin, 5); fin++; }
    }
  }
  return f;
}

function computeCircledRH(fingers){
  const n = fingers.length;
  const circled = new Array(n).fill(false);
  for(let i = 0; i < n; i++){
    if(fingers[i] === 1 && i > 0 && i < n - 1) circled[i] = true;
  }
  return circled;
}

function computeCircledLH(fingers){
  const n = fingers.length;
  const circled = new Array(n).fill(false);
  for(let i = 0; i < n; i++){
    if(fingers[i] === 1 && i + 1 < n) circled[i + 1] = true;
  }
  return circled;
}

function getChordData(){
  const chordOffsets = EXTENSIONS[state.extension].offsets;
  const n = chordOffsets.length;

  // apply inversion: rotate the lowest note(s) up an octave
  let notes = chordOffsets.slice();
  for(let i = 0; i < state.inversion; i++){
    const lowest = notes.shift();
    notes.push(lowest + 12);
  }
  notes.sort((a, b) => a - b);

  // fingering conventions
  const RH_FINGERS_3 = { 0: [1, 3, 5], 1: [1, 2, 5], 2: [1, 3, 5] };
  const LH_FINGERS_3 = { 0: [5, 3, 1], 1: [5, 3, 1], 2: [5, 2, 1] };
  let fingersRH, fingersLH;
  if(n === 3){
    fingersRH = RH_FINGERS_3[state.inversion] || [1, 3, 5];
    fingersLH = LH_FINGERS_3[state.inversion] || [5, 3, 1];
  } else {
    fingersRH = [1, 2, 3, 5];
    fingersLH = [5, 3, 2, 1];
  }

  return { rootName: CHROMATIC[state.tone], label: EXTENSIONS[state.extension].label, offsets: notes, fingersRH, fingersLH };
}

function updateFingerDimming(){
  let activeLH, activeRH;
  if(state.mode === 'chords'){
    const chord = getChordData();
    activeLH = new Set(chord.fingersLH);
    activeRH = new Set(chord.fingersRH);
  } else {
    // In scales mode every finger gets used somewhere in a full run, so nothing is dimmed.
    activeLH = new Set([1,2,3,4,5]);
    activeRH = new Set([1,2,3,4,5]);
  }
  document.querySelectorAll('#handBlockL .finger-num').forEach(span => {
    span.classList.toggle('dim', !activeLH.has(parseInt(span.textContent, 10)));
  });
  document.querySelectorAll('#handBlockR .finger-num').forEach(span => {
    span.classList.toggle('dim', !activeRH.has(parseInt(span.textContent, 10)));
  });
}


function getRawScaleData(){
  const rootName = CHROMATIC[state.tone];
  const def = SCALES[state.scale];
  let offsets, fingersRH, fingersLH, suggested = false;

  if(def.kind === 'standard'){
    offsets = def.offsets;
    const isMajor = def.offsets === majorOffsets;
    fingersRH = isMajor ? majorRH[rootName] : minorRH[rootName];
    fingersLH = isMajor ? majorLH[rootName] : minorLH[rootName];
  } else if(def.kind === 'minorTable'){
    offsets = def.offsets;
    fingersRH = minorRH[rootName];
    fingersLH = minorLH[rootName];
  } else if(def.kind === 'majorPent'){
    offsets = majorPentIdx.map(i => majorOffsets[i]);
    fingersRH = majorPentIdx.map(i => majorRH[rootName][i]);
    fingersLH = majorPentIdx.map(i => majorLH[rootName][i]);
  } else if(def.kind === 'minorPent'){
    offsets = minorPentIdx.map(i => minorOffsets[i]);
    fingersRH = minorPentIdx.map(i => minorRH[rootName][i]);
    fingersLH = minorPentIdx.map(i => minorLH[rootName][i]);
  } else {
    offsets = def.offsets;
    fingersRH = heuristicRH(offsets, state.tone);
    fingersLH = heuristicLH(offsets, state.tone);
    suggested = true;
  }

  return { rootName, label: def.label, offsets, fingersRH, fingersLH, suggested };
}

function getScaleData(){
  const raw = getRawScaleData();
  const fingers = state.hand === 'L' ? raw.fingersLH : raw.fingersRH;
  const slots = raw.offsets.map(o => state.tone + o);
  return { ...raw, slots, fingers };
}

function buildExtendedNotes(offsets, fingers, numOctaves, hand){
  const n = offsets.length;
  const notes = [];
  for(let oct = 0; oct < numOctaves; oct++){
    for(let i = 0; i < n - 1; i++){
      notes.push({ offset: offsets[i] + oct * 12, finger: fingers[i] });
    }
  }
  notes.push({ offset: offsets[n - 1] + (numOctaves - 1) * 12, finger: fingers[n - 1] });
  const extFingers = notes.map(x => x.finger);
  const circled = hand === 'L' ? computeCircledLH(extFingers) : computeCircledRH(extFingers);
  notes.forEach((note, i) => { note.circled = circled[i]; });
  return notes;
}

function buildKeyboard(svgId){
  svgId = svgId || 'keyboard';
  const svg = document.getElementById(svgId);
  if(!svg) return;
  svg.innerHTML = '';
  const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--coral').trim() || '#ff6f52';
  const whiteLetters = ['C','D','E','F','G','A','B'];
  const blackAfter = {C:'C#', D:'D#', F:'F#', G:'G#', A:'A#'};
  const pc = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const WW = 68, WH = 255, BW = 40, BH = 162;

  const OCTAVES = 4;
  const activeMap = {};
  if(state.mode === 'chords'){
    const chord = getChordData();
    if(state.hand === 'both'){
      chord.offsets.forEach((o, idx) => { activeMap[state.tone + o] = { finger: chord.fingersLH[idx], circled: false }; });
      chord.offsets.forEach((o, idx) => { activeMap[state.tone + o + 24] = { finger: chord.fingersRH[idx], circled: false }; });
    } else {
      const fingers = state.hand === 'L' ? chord.fingersLH : chord.fingersRH;
      chord.offsets.forEach((o, idx) => { activeMap[state.tone + o] = { finger: fingers[idx], circled: false }; });
    }
  } else {
    const raw = getRawScaleData();
    if(state.hand === 'both'){
      const circledLH = computeCircledLH(raw.fingersLH);
      const circledRH = computeCircledRH(raw.fingersRH);
      raw.offsets.forEach((o, idx) => { activeMap[state.tone + o] = { finger: raw.fingersLH[idx], circled: circledLH[idx] }; });
      raw.offsets.forEach((o, idx) => { activeMap[state.tone + o + 24] = { finger: raw.fingersRH[idx], circled: circledRH[idx] }; });
    } else {
      const fingers = state.hand === 'L' ? raw.fingersLH : raw.fingersRH;
      const extended = buildExtendedNotes(raw.offsets, fingers, OCTAVES, state.hand);
      extended.forEach(({offset, finger, circled}) => { activeMap[state.tone + offset] = { finger, circled }; });
    }
  }

  const whiteKeys = [], blackKeys = [];
  for(let o = 0; o < OCTAVES; o++){
    whiteLetters.forEach((L, i) => whiteKeys.push({ x:(o*7+i)*WW, letter:L, abs:o*12+pc[L] }));
    whiteLetters.forEach((L, i) => {
      if(blackAfter[L]){
        const name = blackAfter[L];
        blackKeys.push({ x:(o*7+i)*WW + WW - BW/2, letter:name, abs:o*12+pc[name] });
      }
    });
  }

  const totalW = OCTAVES*7*WW;
  svg.setAttribute('viewBox', `0 0 ${totalW} ${WH+42}`);

  clipRect.setAttribute('width', totalW); clipRect.setAttribute('height', WH);
  clipRect.setAttribute('rx', 10); clipRect.setAttribute('ry', 10);
  clip.appendChild(clipRect);
  defs.appendChild(clip);
  svg.appendChild(defs);

  const kbGroup = document.createElementNS('http://www.w3.org/2000/svg','g');

  whiteKeys.forEach(k => {
    const active = activeMap[k.abs];
    const isActive = active !== undefined;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', k.x); rect.setAttribute('y', 0);
    rect.setAttribute('width', WW); rect.setAttribute('height', WH);
    rect.setAttribute('fill', isActive ? accentColor : '#f4f4f1');
    g.appendChild(rect);

    if(isActive){
      const label = document.createElementNS('http://www.w3.org/2000/svg','text');
      label.setAttribute('x', k.x + WW/2); label.setAttribute('y', WH - 52);
      label.setAttribute('text-anchor','middle');
      label.setAttribute('font-family',"'Inter', sans-serif");
      label.setAttribute('font-size','21'); label.setAttribute('font-weight','700'); label.setAttribute('fill', '#f4f4f1');
      label.textContent = k.letter;
      g.appendChild(label);

      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', k.x + WW/2); t.setAttribute('y', WH - 20);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family',"'Inter', sans-serif");
      t.setAttribute('font-size','24'); t.setAttribute('font-weight','700');
      t.setAttribute('fill', '#050505');
      t.textContent = active.finger;
      g.appendChild(t);

      if(active.circled){
        const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
        ring.setAttribute('cx', k.x + WW/2); ring.setAttribute('cy', WH - 28);
        ring.setAttribute('r', 17);
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', '#050505');
        ring.setAttribute('stroke-width', '2.6');

      }

    g.addEventListener('click', () => {

    });

  });

  for(let i = 1; i < whiteKeys.length; i++){
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', i*WW); line.setAttribute('x2', i*WW);

  frame.setAttribute('fill', 'none');
  frame.setAttribute('stroke', '#f4f4f1');
  frame.setAttribute('stroke-width', '1.5');
  kbGroup.appendChild(frame);

  blackKeys.forEach(k => {
    const active = activeMap[k.abs];
    const isActive = active !== undefined;
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
    rect.setAttribute('x', k.x); rect.setAttribute('y', 0);
    rect.setAttribute('width', BW); rect.setAttribute('height', BH);
    rect.setAttribute('fill', isActive ? accentColor : '#050505');
    rect.setAttribute('stroke', '#f4f4f1');
    rect.setAttribute('stroke-width', '1.5');
    g.appendChild(rect);

    if(isActive){
      const t = document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x', k.x + BW/2); t.setAttribute('y', BH - 20);
      t.setAttribute('text-anchor','middle');
      t.setAttribute('font-family',"'Inter', sans-serif");
      t.setAttribute('font-size','18'); t.setAttribute('font-weight','700');
      t.setAttribute('fill', '#050505');
      t.textContent = active.finger;
      g.appendChild(t);

      if(active.circled){
        const ring = document.createElementNS('http://www.w3.org/2000/svg','circle');
        ring.setAttribute('cx', k.x + BW/2); ring.setAttribute('cy', BH - 26);
        ring.setAttribute('r', 13);
        ring.setAttribute('fill', 'none');
        ring.setAttribute('stroke', '#050505');
        ring.setAttribute('stroke-width', '2.2');
        g.appendChild(ring);
      }

      const name = document.createElementNS('http://www.w3.org/2000/svg','text');
      name.setAttribute('x', k.x + BW/2); name.setAttribute('y', BH - 46);
      name.setAttribute('text-anchor','middle');
      name.setAttribute('font-family',"'Inter', sans-serif");
      name.setAttribute('font-size','18'); name.setAttribute('font-weight','700');
      name.setAttribute('fill', '#f4f4f1');
      name.textContent = k.letter;
      g.appendChild(name);
    }
    g.style.cursor = 'pointer';
    g.addEventListener('click', () => {
      state.tone = k.abs % 12;
      render();
    });
    kbGroup.appendChild(g);
  });
  svg.appendChild(kbGroup);
}

/* ---------------- Sheet music (placeholder alternate view) ---------------- */

/* ---------------- Note pills / intervals / quick scales ---------------- */

function buildNotePills(){
  const wrap = document.getElementById('notePills');
  wrap.innerHTML = '';
  if(state.mode === 'chords'){
    const chord = getChordData();
    chord.offsets.forEach((o, idx) => {
      const pcVal = ((state.tone + o) % 12 + 12) % 12;
      const btn = document.createElement('button');
      btn.className = 'note-pill';
      btn.type = 'button';
      btn.textContent = CHROMATIC[pcVal];
      if(idx === 0) btn.classList.add('active');
      btn.addEventListener('click', () => { state.tone = pcVal; render(); });
      wrap.appendChild(btn);
    });
    return;
  }
  const raw = getRawScaleData();
  raw.offsets.forEach((o, idx) => {
    const pcVal = (state.tone + o) % 12;
    const btn = document.createElement('button');
    btn.className = 'note-pill';
    btn.type = 'button';
    btn.textContent = CHROMATIC[pcVal];
    if(idx === 0) btn.classList.add('active');
    btn.addEventListener('click', () => { state.tone = pcVal; render(); });
    wrap.appendChild(btn);
  });
}

function stepLabel(diff){
  let label = '';
  let remaining = diff;
  while(remaining >= 2){
    label += 'W';
    remaining -= 2;
  }
  if(remaining === 1) label += 'H';
  return label || (diff + 'H');
}

const QUICK_PER_PAGE = 4;
let quickPage = 0;

function currentScalePage(){
  const list = state.mode === 'chords' ? EXTENSION_ORDER : ALL_SCALES;
  const key = state.mode === 'chords' ? state.extension : state.scale;
  const idx = list.indexOf(key);
  return Math.max(0, Math.floor(idx / QUICK_PER_PAGE));
}

function buildQuickGrid(){
  const grid = document.getElementById('quickGrid');
  grid.innerHTML = '';
  const isChords = state.mode === 'chords';
  const list = isChords ? EXTENSION_ORDER : ALL_SCALES;
  const totalPages = Math.ceil(list.length / QUICK_PER_PAGE);
  quickPage = Math.min(Math.max(quickPage, 0), totalPages - 1);
  const start = quickPage * QUICK_PER_PAGE;
  const items = list.slice(start, start + QUICK_PER_PAGE);
  items.forEach(key => {
    const btn = document.createElement('button');
    btn.className = 'quick-btn';
    btn.type = 'button';
    btn.textContent = isChords ? EXTENSIONS[key].label : SCALES[key].label;
    const isActive = isChords ? key === state.extension : key === state.scale;
    if(isActive) btn.classList.add('active');
    btn.addEventListener('click', () => {
      if(isChords){ state.extension = key; state.inversion = 0; }
      else{ state.scale = key; }
      render();
    });
    grid.appendChild(btn);
  });
  // Pad remaining slots so the grid always reserves the same number of
  // rows, regardless of how many items are on the current page.
  for(let i = items.length; i < QUICK_PER_PAGE; i++){
    const filler = document.createElement('button');
    filler.type = 'button';
    filler.className = 'quick-btn quick-btn-filler';
    filler.disabled = true;
    filler.textContent = '\u00A0';
    grid.appendChild(filler);
  }
  document.getElementById('quickPanelTitle').textContent = isChords ? 'Quick Chords' : 'Quick Scales';
  document.getElementById('pageIndicator').textContent = (quickPage + 1) + ' / ' + totalPages;
}

document.getElementById('quickPrev').addEventListener('click', () => {
  quickPage = Math.max(0, quickPage - 1);
  buildQuickGrid();
});
document.getElementById('quickNext').addEventListener('click', () => {
  const list = state.mode === 'chords' ? EXTENSION_ORDER : ALL_SCALES;
  const totalPages = Math.ceil(list.length / QUICK_PER_PAGE);
  quickPage = Math.min(totalPages - 1, quickPage + 1);
  buildQuickGrid();
});

/* ---------------- Key / Scale / Hands / Tempo steppers ---------------- */

document.getElementById('keyLeft').addEventListener('click', () => { state.tone = (state.tone + 11) % 12; render(); });
document.getElementById('keyRight').addEventListener('click', () => { state.tone = (state.tone + 1) % 12; render(); });

document.getElementById('scaleLeft').addEventListener('click', () => {
  if(state.mode === 'chords'){
    const idx = EXTENSION_ORDER.indexOf(state.extension);
    state.extension = EXTENSION_ORDER[(idx + EXTENSION_ORDER.length - 1) % EXTENSION_ORDER.length];
    state.inversion = 0;
  } else {
    const idx = ALL_SCALES.indexOf(state.scale);
    state.scale = ALL_SCALES[(idx + ALL_SCALES.length - 1) % ALL_SCALES.length];
  }
  render();
});
document.getElementById('scaleRight').addEventListener('click', () => {
  if(state.mode === 'chords'){
    const idx = EXTENSION_ORDER.indexOf(state.extension);
    state.extension = EXTENSION_ORDER[(idx + 1) % EXTENSION_ORDER.length];
    state.inversion = 0;
  } else {
    const idx = ALL_SCALES.indexOf(state.scale);
    state.scale = ALL_SCALES[(idx + 1) % ALL_SCALES.length];
  }
  render();
});

document.getElementById('handsLeft').addEventListener('click', () => {
  const idx = HAND_ORDER.indexOf(state.hand);
  state.hand = HAND_ORDER[(idx + HAND_ORDER.length - 1) % HAND_ORDER.length];
  render();
});
document.getElementById('handsRight').addEventListener('click', () => {
  const idx = HAND_ORDER.indexOf(state.hand);
  state.hand = HAND_ORDER[(idx + 1) % HAND_ORDER.length];
  render();
});

function handBlockClick(which){
  if(state.hand === 'both'){
    state.hand = (which === 'L') ? 'R' : 'L';
  } else if(state.hand === which){
    return;
  } else {
    state.hand = 'both';
  }
  render();
}
document.getElementById('handBlockL').addEventListener('click', () => handBlockClick('L'));
document.getElementById('handBlockR').addEventListener('click', () => handBlockClick('R'));

document.getElementById('tempoLeft').addEventListener('click', () => {
  if(state.mode === 'chords'){
    const len = EXTENSIONS[state.extension].offsets.length === 3 ? INVERSIONS3.length : INVERSIONS4.length;
    state.inversion = (state.inversion + len - 1) % len;
  } else {
    state.tempoIdx = (state.tempoIdx + TEMPOS.length - 1) % TEMPOS.length;
    onTempoChange();
  }
  render();
});
document.getElementById('tempoRight').addEventListener('click', () => {
  if(state.mode === 'chords'){
    const len = EXTENSIONS[state.extension].offsets.length === 3 ? INVERSIONS3.length : INVERSIONS4.length;
    state.inversion = (state.inversion + 1) % len;
  } else {
    state.tempoIdx = (state.tempoIdx + 1) % TEMPOS.length;
    onTempoChange();
  }
  render();
});

/* ---------------- Audio: metronome + scale playback ---------------- */

let audioCtx = null;
function ensureAudio(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function midiToFreq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

function playNote(freq, startTime, dur){
  const ctx = ensureAudio();
  const osc = ctx.createOscillator();
  const osc2 = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'triangle';
  osc2.type = 'sine';
  osc.frequency.setValueAtTime(freq, startTime);
  osc2.frequency.setValueAtTime(freq * 2, startTime);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(0.32, startTime + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  const gain2 = ctx.createGain();
  gain2.gain.setValueAtTime(0.08, startTime);
  osc.connect(gain);
  osc2.connect(gain2);
  gain2.connect(gain);
  gain.connect(ctx.destination);
  osc.start(startTime); osc.stop(startTime + dur + 0.05);
  osc2.start(startTime); osc2.stop(startTime + dur + 0.05);
}

function playClick(strong){
  const ctx = ensureAudio();
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(strong ? 1600 : 1050, t);
  gain.gain.setValueAtTime(0.22, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.055);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(t); osc.stop(t + 0.06);
}

function setPlayUI(playing){
  const icon = document.getElementById('playIcon');
  icon.innerHTML = playing
    ? '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor" style="display:block"><rect x="5" y="5" width="14" height="14" rx="1.5"/></svg>'
    : '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor" style="display:block"><path d="M6 3l15 9-15 9V3z"/></svg>';
  document.getElementById('playLabel').textContent = playing ? 'Stop Scale' : 'Play Scale';
  document.getElementById('playBtn').classList.toggle('active', playing);
}

let scalePlayTimeouts = [];
let scaleIsPlaying = false;
function stopScale(){
  scalePlayTimeouts.forEach(id => clearTimeout(id));
  scalePlayTimeouts = [];
  scaleIsPlaying = false;
  setPlayUI(false);
}
function playScaleOnce(){
  const ctx = ensureAudio();
  const bpm = TEMPOS[state.tempoIdx];
  const noteDur = 60 / bpm;
  const startTime = ctx.currentTime + 0.05;

  if(state.mode === 'chords'){
    const chord = getChordData();
    const chordDur = noteDur * 2;
    chord.offsets.forEach((o) => {
      const midi = 60 + state.tone + o;
      playNote(midiToFreq(midi), startTime, chordDur * 0.92);
    });
    const totalMs = chordDur * 1000 + 150;
    const id = setTimeout(() => {
      if(state.loop && scaleIsPlaying){
        playScaleOnce();
      } else {
        stopScale();
      }
    }, totalMs);
    scalePlayTimeouts.push(id);
    return;
  }

  const raw = getRawScaleData();
  raw.offsets.forEach((o, i) => {
    const midi = 60 + state.tone + o;
    playNote(midiToFreq(midi), startTime + i * noteDur, noteDur * 0.92);
  });
  const totalMs = raw.offsets.length * noteDur * 1000 + 150;
  const id = setTimeout(() => {
    if(state.loop && scaleIsPlaying){
      playScaleOnce();
    } else {
      stopScale();
    }
  }, totalMs);
  scalePlayTimeouts.push(id);
}
document.getElementById('playBtn').addEventListener('click', () => {
  if(scaleIsPlaying){ stopScale(); return; }
  scaleIsPlaying = true;
  setPlayUI(true);
  playScaleOnce();
});

let metronomeInterval = null;
function startMetronome(){
  ensureAudio();
  let beat = 0;
  const bpm = TEMPOS[state.tempoIdx];
  playClick(true);
  metronomeInterval = setInterval(() => {
    beat = (beat + 1) % 4;
    playClick(beat === 0);
  }, 60000 / bpm);
}
document.getElementById('metronomeBtn').addEventListener('click', () => {
  const btn = document.getElementById('metronomeBtn');
  if(metronomeInterval){
    clearInterval(metronomeInterval);
    metronomeInterval = null;
    btn.classList.remove('active');
    return;
  }
  btn.classList.add('active');
  startMetronome();
});
function onTempoChange(){
  if(metronomeInterval){
    clearInterval(metronomeInterval);
    startMetronome();
  }
}

document.getElementById('loopBtn').addEventListener('click', () => {
  state.loop = !state.loop;
  document.getElementById('loopBtn').classList.toggle('active', state.loop);
});

/* ---------------- Render ---------------- */

function render(){
  document.getElementById('keyValue').textContent = CHROMATIC[state.tone];
  document.getElementById('handsValue').textContent = HAND_LABEL[state.hand];

  if(state.mode === 'chords'){
    document.getElementById('secondControlLabel').innerHTML = 'CHOOSE <span class="accent">EXTENSION</span>';
    document.getElementById('scaleValue').textContent = EXTENSIONS[state.extension].label;
    document.getElementById('fourthControlLabel').innerHTML = 'CHOOSE <span class="accent">INVERSION</span>';
    const invList = EXTENSIONS[state.extension].offsets.length === 3 ? INVERSIONS3 : INVERSIONS4;
    document.getElementById('tempoValue').textContent = invList[state.inversion];
  } else {
    document.getElementById('secondControlLabel').innerHTML = 'CHOOSE A <span class="accent">SCALE</span>';
    document.getElementById('scaleValue').textContent = SCALES[state.scale].label;
    document.getElementById('fourthControlLabel').innerHTML = 'TEMPO <span class="accent">BPM</span>';
    document.getElementById('tempoValue').textContent = TEMPOS[state.tempoIdx];
  }

  const isBoth = state.hand === 'both';
  document.getElementById('handBlockL').classList.toggle('faded', !isBoth && state.hand !== 'L');
  document.getElementById('handBlockR').classList.toggle('faded', !isBoth && state.hand !== 'R');
  updateFingerDimming();

  buildNotePills();

  quickPage = currentScalePage();
  buildQuickGrid();

  document.getElementById('notesPanelTitle').textContent = CHROMATIC[state.tone] + ' ' +
    (state.mode === 'chords' ? EXTENSIONS[state.extension].label.toUpperCase() : SCALES[state.scale].label.toUpperCase());

  buildKeyboard('keyboard');
}

render();
window.addEventListener('resize', () => buildKeyboard('keyboard'));

/* ---------------- Global Functions: mode toggle ---------------- */

document.getElementById('modeScales').addEventListener('click', () => {
  if(state.mode === 'scales') return;
  state.mode = 'scales';
  document.getElementById('modeScales').classList.add('active');
  document.getElementById('modeChords').classList.remove('active');
  render();
});
document.getElementById('modeChords').addEventListener('click', () => {
  if(state.mode === 'chords') return;
  state.mode = 'chords';
  document.getElementById('modeChords').classList.add('active');
  document.getElementById('modeScales').classList.remove('active');
  render();
});
</script>
